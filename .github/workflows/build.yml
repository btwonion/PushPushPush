name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            python3-cairo \
            python3-gi

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build installable archive
        run: |
          mkdir -p dist/PushPushPush
          cp -R pushpushpush share dist/PushPushPush/
          cp README.md install.sh run.sh uninstall.sh dist/PushPushPush/
          chmod +x dist/PushPushPush/install.sh \
            dist/PushPushPush/run.sh \
            dist/PushPushPush/uninstall.sh
          tar -C dist -czf dist/PushPushPush.tar.gz PushPushPush

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PushPushPush-${{ github.sha }}
          path: dist/PushPushPush.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: PushPushPush-${{ github.sha }}
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/PushPushPush.tar.gz#PushPushPush-${GITHUB_REF_NAME}.tar.gz"
          --generate-notes
          --title "PushPushPush ${GITHUB_REF_NAME}"
